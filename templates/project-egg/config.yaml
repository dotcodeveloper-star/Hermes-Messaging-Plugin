# Starter configuration copied into the project-egg profile on first activation.
# Add your project-wide Hermes settings here before installing the plugin.
model:
  default: gpt-6-sol
  provider: openai-codex
# Children spawned with delegate_task run on this model instead of inheriting the
# session's. The session keeps its own model and prompt cache; heavy sub-work goes
# to a fresh child on the strongest model available to this profile.
delegation:
  model: gpt-6-sol-pro
  provider: openai-codex
# The installer resolves this placeholder to each profile's own absolute root,
# alongside SOUL.md, PROJECT.yaml and memories/ (not its workspace/ subdirectory).
terminal:
  cwd: .
skills:
  external_dirs:
    - ../global-project/skills
# Keep interim replies enabled for the single preamble defined in SOUL.md.
display:
  busy_ack_enabled: false
  show_reasoning: false
  thinking_progress: false
  tool_progress: false
  long_running_notifications: false
  interim_assistant_messages: true
  platforms:
    mattermost:
      show_reasoning: false
      thinking_progress: false
      tool_progress: false
      long_running_notifications: false
      streaming: false
      interim_assistant_messages: true
    gitlab:
      show_reasoning: false
      thinking_progress: false
      tool_progress: false
      long_running_notifications: false
      streaming: false
      interim_assistant_messages: true
onboarding:
  seen:
    busy_input_prompt: true
